<app-navbar></app-navbar>

<section class="hero bg-[#e1eacd] px-6 py-16 text-center space-y-6">
  <h1 class="text-3xl md:text-4xl font-bold text-[#01352c]">
    Fresh food. Everyday essentials. Affordable tech.
  </h1>

  <p class="text-[#01352c]/80 max-w-xl mx-auto">
    Built for our communities. Powered by local farmers.
  </p>

  <button
    routerLink="/products"
    class="bg-[#61b390] text-[#01352c] px-6 py-3 rounded-md font-medium hover:bg-[#4aa982] transition"
  >
    Shop now
  </button>
</section>

<section class="products px-6 py-10">
  <h2 class="text-xl font-semibold text-[#01352c] mb-6">
    Featured products
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <app-product-card
      *ngFor="let product of products"
      [product]="product">
    </app-product-card>
  </div>
</section>

<app-footer></app-footer>
