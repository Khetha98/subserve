
<section class="max-w-xl mx-auto px-6 py-16">

  <h1 class="text-3xl font-bold text-center mb-8">
    Contact Us
  </h1>

  <form class="space-y-4">

    <input
      type="text"
      placeholder="Name"
      class="w-full border p-3 rounded"
    />

    <input
      type="email"
      placeholder="Email"
      class="w-full border p-3 rounded"
    />

    <textarea
      placeholder="Message"
      class="w-full border p-3 rounded">
    </textarea>

    <button
      class="bg-[#61b390] px-6 py-3 rounded w-full">
      Send
    </button>

  </form>

</section>
