<div class="max-w-md mx-auto mt-20 p-6 bg-white rounded-lg shadow border border-gray-100">

  <h1 class="text-2xl font-bold mb-6 text-center text-[#01352c]">
    Login to Subserve Digital
  </h1>

  <form [formGroup]="loginForm" (ngSubmit)="login()">

    <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Email Address</label>
      <input
        type="email"
        placeholder="name@domain.co.za"
        formControlName="email"
        class="w-full border border-gray-300 p-3 rounded-lg text-sm focus:outline-none focus:border-[#61b390]"
      >
    </div>

    <div class="mb-6">
      <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Password</label>
      <input
        type="password"
        placeholder="Enter your password"
        formControlName="password"
        class="w-full border border-gray-300 p-3 rounded-lg text-sm focus:outline-none focus:border-[#61b390]"
      >
    </div>

    <button
      type="submit"
      class="w-full bg-[#61b390] hover:bg-[#01352c] text-white p-3 rounded-lg font-semibold transition-colors shadow-md"
    >
      Login
    </button>

  </form>

</div>
