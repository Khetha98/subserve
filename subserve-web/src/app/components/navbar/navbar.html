<nav class="bg-[#01352c] text-[#e1eacd] px-6 py-4 relative shadow-md">
  
  <div class="flex items-center justify-between">
    <!-- Left Logo & Mobile Toggle -->
    <div class="flex items-center gap-4">
      <!-- Mobile Hamburger Button (Only visible on small screens) -->
      <button 
        (click)="toggleMenu()" 
        class="md:hidden text-2xl focus:outline-none hover:text-[#61b390] transition-colors"
        aria-label="Toggle Navigation Menu"
      >
        ☰
      </button>

      <a 
        routerLink="/" 
        routerLinkActive="active" 
        class="flex items-center gap-2 font-semibold text-lg cursor-pointer"
        (click)="goHome()"
      >
        Subserve Digital
        <img src="logo.png" class="w-8 h-8 rounded-full border border-[#61b390]" alt="Subserve Logo" />
      </a>
    </div>

    <!-- Center Navigation (Desktop View) -->
    <div class="hidden md:flex items-center gap-6 font-medium">
      <a routerLink="/services" routerLinkActive="text-[#61b390]" class="hover:text-[#61b390] transition-colors">
        Services
      </a>

      <a routerLink="/orders" routerLinkActive="text-[#61b390]" class="hover:text-[#61b390] transition-colors">
        Orders
      </a>

      <a routerLink="/about" routerLinkActive="text-[#61b390]" class="hover:text-[#61b390] transition-colors">
        About
      </a>

      <a routerLink="/contact" routerLinkActive="text-[#61b390]" class="hover:text-[#61b390] transition-colors">
        Contact
      </a>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-4">

      <!-- ZAR Locked Selector (Commented Out)
      <select
        disabled
        class="px-3 py-1 rounded-md bg-[#bad8b6] text-[#01352c] font-semibold text-sm cursor-not-allowed opacity-90"
        title="Currency fixed to ZAR for South African operations"
      >
        <option value="ZAR">ZAR (R)</option>
      </select>
      -->

      <a routerLink="/cart" class="hover:text-[#61b390] text-lg transition-colors" title="Shopping Cart">
        🛒
      </a>

      <!-- Desktop Auth Links -->
      <div class="hidden md:block">
        <ng-container *ngIf="isLoggedIn; else guest">
          <div class="flex items-center gap-3">
            <a routerLink="/profile" class="hover:text-[#61b390] transition-colors text-sm font-medium">
              Profile
            </a>

            <button
              (click)="logout()"
              class="px-3 py-1 bg-red-500 text-white rounded text-xs font-semibold hover:bg-red-600 transition-colors"
            >
              Logout
            </button>

            <div class="w-8 h-8 bg-[#61b390] text-[#01352c] rounded-full flex items-center justify-center font-bold text-sm shadow">
              U
            </div>
          </div>
        </ng-container>

        <ng-template #guest>
          <div class="flex items-center gap-3 text-sm font-medium">
            <a routerLink="/login" class="hover:text-[#61b390] transition-colors">Login</a>
            <a routerLink="/register" class="bg-[#61b390] text-[#01352c] px-3 py-1 rounded font-semibold hover:bg-white transition-colors">
              Register
            </a>
          </div>
        </ng-template>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div 
    *ngIf="isMenuOpen" 
    class="md:hidden mt-4 pt-4 border-t border-[#61b390]/30 flex flex-col gap-4 font-medium animate-fadeIn"
  >
    <a 
      routerLink="/services" 
      routerLinkActive="text-[#61b390]" 
      (click)="closeMenu()" 
      class="hover:text-[#61b390] transition-colors py-1"
    >
      Services
    </a>

    <a 
      routerLink="/orders" 
      routerLinkActive="text-[#61b390]" 
      (click)="closeMenu()" 
      class="hover:text-[#61b390] transition-colors py-1"
    >
      Orders
    </a>

    <a 
      routerLink="/about" 
      routerLinkActive="text-[#61b390]" 
      (click)="closeMenu()" 
      class="hover:text-[#61b390] transition-colors py-1"
    >
      About
    </a>

    <a 
      routerLink="/contact" 
      routerLinkActive="text-[#61b390]" 
      (click)="closeMenu()" 
      class="hover:text-[#61b390] transition-colors py-1"
    >
      Contact
    </a>

    <div class="border-t border-[#61b390]/20 pt-3 mt-1">
      <ng-container *ngIf="isLoggedIn; else mobileGuest">
        <div class="flex items-center justify-between">
          <a routerLink="/profile" (click)="closeMenu()" class="hover:text-[#61b390] font-medium text-sm">
            Profile
          </a>
          <button
            (click)="logout()"
            class="px-3 py-1 bg-red-500 text-white rounded text-xs font-semibold hover:bg-red-600 transition-colors"
          >
            Logout
          </button>
        </div>
      </ng-container>

      <ng-template #mobileGuest>
        <div class="flex items-center gap-4 text-sm font-medium pt-1">
          <a routerLink="/login" (click)="closeMenu()" class="hover:text-[#61b390] transition-colors">Login</a>
          <a routerLink="/register" (click)="closeMenu()" class="bg-[#61b390] text-[#01352c] px-4 py-1.5 rounded font-semibold hover:bg-white transition-colors">
            Register
          </a>
        </div>
      </ng-template>
    </div>
  </div>

</nav>
