<nav class="bg-[#01352c] text-[#e1eacd] px-6 py-4 flex items-center justify-between">

  <!-- Left -->
  <div class="flex items-center gap-4">
    <button (click)="toggleMenu()" class="text-xl">☰</button>

    <a routerLink="/" routerLinkActive="active" class="flex items-center gap-2 font-semibold text-lg"
      (click)="goHome()"
    >
       Subserve
      <img src="logo.png" class="w-8 h-8 rounded-full" />
      
    </a>
  </div>

  <!-- Center Navigation -->
  <div class="hidden md:flex items-center gap-6 font-medium">

    <!-- <a routerLink="/products" class="hover:text-[#61b390]">
      Products
    </a> -->

    <a routerLink="/services" class="hover:text-[#61b390]">
      Services
    </a>

    <a routerLink="/about" class="hover:text-[#61b390]">
      About
    </a>

    <a routerLink="/contact" class="hover:text-[#61b390]">
      Contact
    </a>

  </div>

  <!-- Right -->
  <div class="flex items-center gap-4">

    <select
      #currencySelect
      (change)="changeCurrency(currencySelect.value)"
      class="px-2 py-1 rounded-md bg-[#bad8b6] text-[#01352c]"
    >
      <option value="ZAR">ZAR</option>
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
    </select>

    <a routerLink="/cart">🛒</a>

  <ng-container *ngIf="isLoggedIn; else guest">

    <div class="flex items-center gap-3">

      <a routerLink="/profile" class="hover:text-[#61b390]">
        Profile
      </a>

      <button
        (click)="logout()"
        class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600"
      >
        Logout
      </button>

      <div
        class="w-8 h-8 bg-[#61b390] rounded-full flex items-center justify-center font-semibold"
      >
        U
      </div>

    </div>

  </ng-container>

    <ng-template #guest>
      <a routerLink="/login">Login</a>
      <a routerLink="/register">Register</a>
    </ng-template>

  </div>
</nav>
