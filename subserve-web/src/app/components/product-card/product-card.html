<div class="card bg-white border border-[#bad8b6] rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
  <img
    [src]="product.imageUrl"
    class="h-40 w-full object-cover"
  />

  <div class="p-4 space-y-2 flex-1 flex flex-col">
    <h3 class="font-medium text-[#01352c]">{{ product.name }}</h3>

    <p class="text-[#61b390] font-semibold">
      R {{ product.price }}
    </p>

    <button
      class="mt-auto bg-[#61b390] text-[#01352c] px-4 py-2 rounded-md hover:bg-[#4aa982] transition"
    >
      Add to cart
    </button>
  </div>
</div>
