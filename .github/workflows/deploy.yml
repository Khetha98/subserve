name: Build and Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd subserve-web
          npm ci

      - name: Build Production Bundle (with Base Href)
        run: |
          cd subserve-web
          npx ng build --configuration production --base-href=/
          cp dist/subserve-web/browser/index.html dist/subserve-web/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: subserve-web/dist/subserve-web/browser
          branch: gh-pages